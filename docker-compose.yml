services:
  magicbox-device:
    build: .
    restart: unless-stopped
    # BlueZ D-Bus and DRM/KMS video output are host resources - this container
    # is intentionally not isolated from them. `privileged` + `network_mode: host`
    # is the pragmatic way to get both working without hand-tuning device
    # cgroup rules and capability sets; fine for a single-purpose home device,
    # worth revisiting if this ever needs to run somewhere less trusted.
    privileged: true
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ${MAGICBOX_MOVIES_DIR:-./movies}:/movies:ro
    environment:
      MAGICBOX_DEVICE_NAME: ${MAGICBOX_DEVICE_NAME:-MagicBox}
      # Uncomment to override the default `--vo=gpu --gpu-context=drm` mpv output
      # args baked into the image (e.g. to pin a specific --drm-connector).
      # MAGICBOX_MPV_ARGS: "--vo=gpu --gpu-context=drm --drm-connector=HDMI-A-1"

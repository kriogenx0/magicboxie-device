[project]
name = "magicboxie-device"
version = "0.1.0"
description = "MagicBoxie device daemon: BLE GATT control surface driving mpv for HDMI playback"
requires-python = ">=3.9"
dependencies = [
    "bluez-peripheral>=0.1.7",
    "aiohttp>=3.9",
    "Pillow>=10.0",
    "evdev>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "aioresponses>=0.7",
]

[project.scripts]
magicboxie-device = "player_app.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["player_app*"]
